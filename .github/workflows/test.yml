# Dual-host regression: the repo pins @deepseek-ai devDependencies to the
# newest validated alpha, but the peer range promises compatibility back to
# 0.1.1-rc.2. This workflow re-pins every @deepseek-ai/* devDependency to an
# older host line and runs the same build+test suite against it, so a change
# that only works on the newest alpha fails here instead of shipping.
# scripts/pin-dsh-dev-deps.mjs rewrites package.json in place (CI-only, never
# committed); the install is --no-frozen-lockfile because the pin deliberately
# drifts from pnpm-lock.yaml on the non-default leg.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.1.2-alpha.5', '0.1.2-alpha.4']
    steps:
      - uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node's cache hook runs.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Pin @deepseek-ai devDependencies to ${{ matrix.dsh }}
        run: node scripts/pin-dsh-dev-deps.mjs "${{ matrix.dsh }}"

      - name: Install
        run: pnpm install --no-frozen-lockfile

      # pnpm test = pnpm build && vitest run (manifest-consistency asserts the
      # built artifacts exist, same ordering as release.yml).
      - name: Test
        run: pnpm test
