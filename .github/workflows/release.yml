# Release publishing: pushing a `v*` tag builds the plugin, runs the test
# suite, packs the npm tarball, and publishes a GitHub release with
# auto-generated notes and the tarball attached. The tag is the trigger and
# the release title; nothing else needs manual input.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node's cache hook runs.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # manifest-consistency.spec asserts the built artifacts exist, so the
      # build has to precede the tests.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Pack
        run: |
          mkdir dist
          pnpm pack --pack-destination dist
          echo "TARBALL=$(ls dist/*.tgz)" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" "$TARBALL"
