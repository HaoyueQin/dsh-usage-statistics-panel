# Single-host regression: devDependencies pin every @deepseek-ai/* package to
# the DSH 0.1.2-rc.1 line, and the peer range promises DSH >= 0.1.2-rc.1, so
# every push/PR runs the full build+test suite against exactly that baseline.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node's cache hook runs.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # pnpm test = pnpm build && vitest run (manifest-consistency asserts the
      # built artifacts exist, same ordering as release.yml).
      - name: Test
        run: pnpm test
